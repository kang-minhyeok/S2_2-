<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - GuardHub</title>
<link rel="stylesheet" href="/css/login.css">
</head>
<body>

	<!-- home.css의 .page 역할 -->
	<div class="page">
		<!-- home.css의 .card 역할 (흰색 큰 카드) -->
		<div class="card">

			<!-- 로고를 큰 카드 안쪽 제일 위에 배치 -->
			<header class="header">
				<a class="logo" href="/">가드허브</a>
			</header>

			<!-- 중앙 로그인 폼 -->
			<main class="login-wrap">
				<section class="login-box">
					<h1 class="title">로그인</h1>
					<p class="sub">아이디와 비밀번호를 입력해 주세요.</p>

					<p class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
					<p class="info" th:if="${param.logout}">로그아웃되었습니다.</p>

					<form class="form" method="post" action="/loginProc">
						<div class="field">
							<label class="label" for="username">아이디</label> <input
								class="input" id="username" type="text" name="username"
								autocomplete="username" required>
						</div>

						<div class="field">
							<label class="label" for="password">비밀번호</label> <input
								class="input" id="password" type="password" name="password"
								autocomplete="current-password" required>
						</div>

						<button class="btn btn-primary" type="submit">로그인</button>
					</form>

					<div class="links">
						<span>계정이 없으신가요?</span> <a class="link" href="/signup">회원가입</a>
					</div>
				</section>
			</main>

		</div>
	</div>

</body>
</html>
